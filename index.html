<body>
<div id="app"></div>
<noscript>This trainer needs JavaScript.</noscript>
<script>(() => {
'use strict';
// ---- wheel.js ----
// Wheel: data + geometry for the European single-zero wheel.
// Everything below is generated from SEQUENCE; nothing else is hand-coded per pocket.

const SEQUENCE = Object.freeze([
  0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
  5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26,
]);

const POCKET_COUNT = SEQUENCE.length;
const POCKET_ANGLE = 360 / POCKET_COUNT;
const DIRECTIONS = Object.freeze(['CW', 'CCW']);

const RED_NUMBERS = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);

// Sectors and arcs are declared as clockwise runs: [first number, length].
const SECTOR_SPANS = {
  voisins: { name: 'Voisins du Zéro', short: 'Voisins', spans: [[22, 17]] },
  tiers: { name: 'Tiers du Cylindre', short: 'Tiers', spans: [[27, 12]] },
  orphelins: { name: 'Orphelins', short: 'Orphelins', spans: [[17, 3], [1, 5]] },
  zerospiel: { name: 'Zero-Spiel', short: 'Zero-Spiel', spans: [[12, 7]] },
};
const MAIN_SECTORS = Object.freeze(['voisins', 'tiers', 'orphelins']);

const ARC_START = 22;
const ARC_LENGTHS = [4, 4, 4, 5, 3, 4, 4, 4, 5];

const mod = (n) => ((n % POCKET_COUNT) + POCKET_COUNT) % POCKET_COUNT;
const INDEX_OF = new Map(SEQUENCE.map((value, index) => [value, index]));

function indexOf(value) {
  const index = INDEX_OF.get(value);
  if (index === undefined) throw new RangeError(`Unknown wheel number: ${value}`);
  return index;
}

function run(first, length) {
  const start = indexOf(first);
  return Array.from({ length }, (_, i) => SEQUENCE[mod(start + i)]);
}

function sign(direction) {
  if (direction === 'CW') return 1;
  if (direction === 'CCW') return -1;
  throw new RangeError(`Unknown direction: ${direction}`);
}

const SECTORS = Object.freeze(Object.fromEntries(
  Object.entries(SECTOR_SPANS).map(([id, s]) => {
    const runs = s.spans.map(([first, length]) => run(first, length));
    return [id, Object.freeze({ id, name: s.name, short: s.short, runs, numbers: runs.flat() })];
  }),
));

function sectorRuns(sectorId) {
  const sector = SECTORS[sectorId];
  if (!sector) throw new RangeError(`Unknown sector: ${sectorId}`);
  return sector.runs;
}

function mainSectorOf(value) {
  return MAIN_SECTORS.find((id) => SECTORS[id].numbers.includes(value));
}

const ARCS = Object.freeze((() => {
  let first = indexOf(ARC_START);
  return ARC_LENGTHS.map((length, i) => {
    const numbers = run(SEQUENCE[first], length);
    first = mod(first + length);
    return Object.freeze({ id: `A${i + 1}`, numbers, sector: mainSectorOf(numbers[0]) });
  });
})());

const JUNCTIONS = Object.freeze(ARCS.map((arc, i) => {
  const nextArc = ARCS[(i + 1) % ARCS.length];
  return Object.freeze({ from: arc.numbers.at(-1), to: nextArc.numbers[0], arcs: [arc.id, nextArc.id] });
}));

function colorOf(value) {
  if (value === 0) return 'green';
  return RED_NUMBERS.has(value) ? 'red' : 'black';
}

const POCKETS = Object.freeze(SEQUENCE.map((value, index) => Object.freeze({
  value,
  index,
  angle: index * POCKET_ANGLE,
  color: colorOf(value),
  previous: SEQUENCE[mod(index - 1)],
  next: SEQUENCE[mod(index + 1)],
  arc: ARCS.find((a) => a.numbers.includes(value)).id,
  sectors: Object.keys(SECTORS).filter((id) => SECTORS[id].numbers.includes(value)),
})));

function pocket(value) {
  return POCKETS[indexOf(value)];
}

function arcById(id) {
  const arc = ARCS.find((a) => a.id === id);
  if (!arc) throw new RangeError(`Unknown arc: ${id}`);
  return arc;
}

function step(value, n, direction) {
  return SEQUENCE[mod(indexOf(value) + sign(direction) * n)];
}

// The number under a stationary marker at 12 o'clock, for any rotor angle (degrees, clockwise).
function pocketAtMarker(rotorAngle) {
  return SEQUENCE[mod(Math.round(-rotorAngle / POCKET_ANGLE))];
}

function neighbors(value, n) {
  const cw = Array.from({ length: n }, (_, i) => step(value, i + 1, 'CW'));
  const ccw = Array.from({ length: n }, (_, i) => step(value, n - i, 'CCW'));
  return { ccw, cw };
}

function distance(a, b, direction) {
  return mod(sign(direction) * (indexOf(b) - indexOf(a)));
}

function shortestDistance(a, b) {
  const cw = distance(a, b, 'CW');
  const ccw = distance(a, b, 'CCW');
  return cw <= ccw ? { pockets: cw, direction: 'CW' } : { pockets: ccw, direction: 'CCW' };
}

// ---- scheduler.js ----
// Scheduler: Leitner-style spaced repetition (5 boxes). Pure functions only.

const DAY_MS = 86_400_000;
const BOX_COUNT = 5;
// Days until an item in box N (1-based) comes back.
const BOX_INTERVAL_DAYS = [0, 1, 3, 7, 14];
const LATENCY_HISTORY = 10;
const REQUEUE_MIN = 3;
const REQUEUE_MAX = 5;

function newItemState() {
  return { box: 1, due: 0, attempts: 0, correct: 0, errors: 0, lat: [] };
}

function review(state, isCorrect, now, latencyMs) {
  const box = isCorrect ? Math.min(BOX_COUNT, state.box + 1) : 1;
  return {
    box,
    due: isCorrect ? now + BOX_INTERVAL_DAYS[box - 1] * DAY_MS : now,
    attempts: state.attempts + 1,
    correct: state.correct + (isCorrect ? 1 : 0),
    errors: state.errors + (isCorrect ? 0 : 1),
    lat: [...state.lat, latencyMs].slice(-LATENCY_HISTORY),
  };
}

// In-session requeue: a missed item reappears after 3 to 5 other questions.
function requeueMissed(queue, id, asked, rng) {
  const gap = REQUEUE_MIN + Math.floor(rng() * (REQUEUE_MAX - REQUEUE_MIN + 1));
  return [...queue.filter((q) => q.id !== id), { id, at: asked + gap }];
}

function pickNext({ ids, states, now, queue, asked, lastId }) {
  const candidates = ids.filter((id) => id !== lastId);
  const pool = candidates.length > 0 ? candidates : ids;
  const stateOf = (id) => states[id] ?? null;

  const ready = queue.filter((q) => q.at <= asked && pool.includes(q.id)).sort((a, b) => a.at - b.at);
  if (ready.length > 0) return ready[0].id;

  const seen = pool.filter((id) => stateOf(id) && stateOf(id).attempts > 0);
  const due = seen
    .filter((id) => stateOf(id).due <= now)
    .sort((a, b) => stateOf(a).box - stateOf(b).box || stateOf(b).errors - stateOf(a).errors);
  if (due.length > 0) return due[0];

  const fresh = pool.find((id) => !stateOf(id) || stateOf(id).attempts === 0);
  if (fresh !== undefined) return fresh;

  return [...seen].sort((a, b) => stateOf(a).due - stateOf(b).due)[0];
}

function weakSpots(states, limit) {
  return Object.entries(states)
    .filter(([, s]) => s.errors > 0)
    .sort(([, a], [, b]) => b.errors - a.errors)
    .slice(0, limit)
    .map(([id, s]) => ({ id, errors: s.errors }));
}

// ---- items.js ----
// Items: the catalog of things the scheduler tracks, generated from the wheel model.
// Catalog order is introduction order: chunk by chunk, never one answer many times in a row.


const ARROW = { CW: '→', CCW: '←' };

function interleave(lists) {
  const longest = Math.max(...lists.map((l) => l.length));
  return Array.from({ length: longest }, (_, i) => lists.map((l) => l[i]))
    .flat()
    .filter((x) => x !== undefined);
}

function sectorMemberItems() {
  const bySector = MAIN_SECTORS.map((id) => SECTORS[id].numbers);
  return interleave(bySector).map((n) => ({ id: `sm:${n}`, kind: 'sectorMember', dir: null, n }));
}

function sectorEdgeItems() {
  return Object.values(SECTORS).flatMap((sector) => sector.runs.flatMap((_, run) => (
    ['first', 'last'].flatMap((edge) => DIRECTIONS.map((dir) => ({
      id: `se:${sector.id}:${run}:${edge}:${dir}`, kind: 'sectorEdge', dir, sector: sector.id, run, edge,
    })))
  )));
}

function arcItems(arc) {
  const pairs = arc.numbers.slice(0, -1).map((n, i) => [n, arc.numbers[i + 1]]);
  const steps = pairs.flatMap(([a, b]) => [
    { id: `as:${a}>${b}`, kind: 'arcStep', dir: 'CW', from: a, to: b },
    { id: `as:${b}>${a}`, kind: 'arcStep', dir: 'CCW', from: b, to: a },
  ]);
  const missing = arc.numbers.map((n) => ({ id: `am:${n}`, kind: 'arcMissing', dir: null, n, arc: arc.id }));
  const complete = DIRECTIONS.map((dir) => ({ id: `ac:${arc.id}:${dir}`, kind: 'arcComplete', dir, arc: arc.id }));
  return [...steps, ...missing, ...complete];
}

function junctionItems() {
  return JUNCTIONS.flatMap((j) => [
    { id: `js:${j.from}>${j.to}`, kind: 'junctionStep', dir: 'CW', from: j.from, to: j.to },
    { id: `js:${j.to}>${j.from}`, kind: 'junctionStep', dir: 'CCW', from: j.to, to: j.from },
  ]);
}

// Chains start at the junctions (where arcs must fuse), then everywhere else.
function chainItems() {
  const junctionFirst = [...new Set([...JUNCTIONS.map((j) => j.from), ...SEQUENCE])];
  return junctionFirst.flatMap((n) => DIRECTIONS.map((dir) => ({ id: `ch:${n}:${dir}`, kind: 'chain', dir, n })));
}

function distanceItems() {
  const steps = ['near', 'far'].flatMap((band) => SEQUENCE.flatMap((n) => DIRECTIONS.map((dir) => (
    { id: `ds:${n}:${dir}:${band}`, kind: 'distStep', dir, n, band }))));
  const counts = SEQUENCE.map((n) => ({ id: `dc:${n}`, kind: 'distCount', dir: null, n }));
  const around = SEQUENCE.map((n) => ({ id: `nb:${n}`, kind: 'neighbors', dir: null, n }));
  const nearCount = SEQUENCE.length * DIRECTIONS.length;
  return [...interleave([steps.slice(0, nearCount), counts, around]), ...steps.slice(nearCount)];
}

function positionItems() {
  return interleave([
    SEQUENCE.map((n) => ({ id: `pn:${n}`, kind: 'posName', dir: null, n })),
    SEQUENCE.map((n) => ({ id: `pt:${n}`, kind: 'posTap', dir: null, n })),
  ]);
}

function segmentItems() {
  return SEQUENCE.map((n) => ({ id: `sg:${n}`, kind: 'segment', dir: null, n }));
}

// dir is the direction the ring turns. Marker reading first, then looking 1 to 4 pockets ahead.
function rotationItems() {
  const marker = DIRECTIONS.map((dir) => ({ id: `rm:${dir}`, kind: 'rotMarker', dir, ahead: 0 }));
  const arrive = [1, 2, 3, 4].flatMap((ahead) => DIRECTIONS.map((dir) => ({ id: `ra:${dir}:${ahead}`, kind: 'rotArrive', dir, ahead })));
  return [...marker, ...arrive];
}

const CATALOG = Object.freeze({
  2: Object.freeze([...sectorMemberItems(), ...sectorEdgeItems()]),
  3: Object.freeze(ARCS.flatMap(arcItems)),
  4: Object.freeze([...junctionItems(), ...chainItems()]),
  5: Object.freeze(distanceItems()),
  6: Object.freeze(positionItems()),
  7: Object.freeze(segmentItems()),
  8: Object.freeze(rotationItems()),
});

const DISTANCE_KINDS = Object.freeze(['distStep', 'distCount', 'neighbors']);
const SPATIAL_KINDS = Object.freeze(['posName', 'posTap']);

function allItems() {
  return Object.values(CATALOG).flat();
}

const BY_ID = new Map(Object.values(CATALOG).flat().map((item) => [item.id, item]));

function stageItems(stage) {
  return CATALOG[stage] ?? [];
}

function itemById(id) {
  return BY_ID.get(id) ?? null;
}


function sectorChunk(sectorId, focus) {
  const sector = SECTORS[sectorId];
  return { id: `sector:${sectorId}`, title: sector.name, runs: sector.runs, mark: [], view: 'full', focus };
}

function arcChunk(arcId, focus) {
  const arc = arcById(arcId);
  return { id: `arc:${arcId}`, title: `Arc ${arcId} · ${SECTORS[arc.sector].short}`, runs: [arc.numbers], mark: [], view: 'arc', focus };
}

// The chunk a learner must have seen before an item is asked. Shown once, as a study card.
function studyChunk(item) {
  switch (item.kind) {
    case 'sectorMember': return sectorChunk(mainSectorOf(item.n), item.n);
    case 'sectorEdge': return sectorChunk(item.sector, SECTORS[item.sector].runs[item.run][0]);
    case 'arcStep': return arcChunk(pocket(item.from).arc, item.from);
    case 'arcMissing': return arcChunk(item.arc, item.n);
    case 'arcComplete': return arcChunk(item.arc, arcById(item.arc).numbers[1]);
    case 'junctionStep': {
      const [from, to] = item.dir === 'CW' ? [item.from, item.to] : [item.to, item.from];
      const numbers = [...arcById(pocket(from).arc).numbers, ...arcById(pocket(to).arc).numbers];
      return { id: `junction:${from}|${to}`, title: `Junction ${from} | ${to}`, runs: [numbers], mark: [from, to], view: 'arc', focus: from };
    }
    default: return null;
  }
}

function itemLabel(item) {
  switch (item.kind) {
    case 'sectorMember': return `${item.n} · sector`;
    case 'sectorEdge': return `${SECTORS[item.sector].short} · ${item.edge} ${item.dir}`;
    // Written in ring order, so a CCW step from 13 to 27 reads "27 ← 13".
    case 'junctionStep':
    case 'arcStep': return item.dir === 'CW'
      ? `${item.from} ${ARROW.CW} ${item.to}`
      : `${item.to} ${ARROW.CCW} ${item.from}`;
    case 'arcMissing': return `${item.n} · in arc ${pocket(item.n).arc}`;
    case 'arcComplete': return `Arc ${item.arc} · ${item.dir}`;
    case 'chain': return `Chain from ${item.n} ${item.dir}`;
    case 'distStep': return `${item.n} · ${item.band} ${item.dir}`;
    case 'distCount': return `Distance from ${item.n}`;
    case 'neighbors': return `±4 of ${item.n}`;
    case 'posName': return `Name pocket ${item.n}`;
    case 'posTap': return `Find pocket ${item.n}`;
    case 'segment': return `Segment around ${item.n}`;
    case 'rotMarker': return `At the marker · ring ${item.dir}`;
    case 'rotArrive': return `Arrives in ${item.ahead} · ring ${item.dir}`;
    default: return item.id;
  }
}

// ---- questions.js ----
// QuestionEngine: turns a catalog item into a concrete question (prompt, options, wheel
// presentation, feedback). Pure; all randomness comes in through rng.
// Prompt parts are strings or tokens: { n } number chip, { dir } direction badge, { sector } label.


const NEAR_MAX = 4;
const SAME_SHADE_MAX = 9;
const OPTION_COUNT = 4;

function shuffled(list, rng) {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function randomRotorAngle(rng) {
  return Math.floor(rng() * 360);
}

// Wrong options: near neighbors (within 4 pockets) plus a same-shade number. Never random.
function distractors(answer, exclude, rng, count) {
  const blocked = new Set([answer, ...exclude]);
  const shade = pocket(answer).color;
  const candidates = SEQUENCE.filter((n) => !blocked.has(n));
  const gap = (n) => shortestDistance(answer, n).pockets;
  const near = shuffled(candidates.filter((n) => gap(n) <= NEAR_MAX), rng);
  const sameShade = shuffled(
    candidates.filter((n) => gap(n) > NEAR_MAX && gap(n) <= SAME_SHADE_MAX && pocket(n).color === shade),
    rng,
  );
  const picked = [...near.slice(0, count - 1), ...sameShade.slice(0, 1)];
  const spare = near.slice(count - 1);
  return [...picked, ...spare].slice(0, count);
}

function numberOptions(answer, exclude, rng) {
  const values = [answer, ...distractors(answer, exclude, rng, OPTION_COUNT - 1)];
  return shuffled(values, rng).map((value) => ({ value, label: [{ n: value }] }));
}

function numberQuestion(base, { answer, exclude, recall, rng }) {
  return {
    ...base,
    answer,
    answerType: recall ? 'keypad' : 'choice',
    options: recall ? null : numberOptions(answer, exclude, rng),
  };
}

function ringRelation(from, to, dir) {
  return dir === 'CW' ? [{ n: from }, ' → ', { n: to }] : [{ n: to }, ' ← ', { n: from }];
}

function sectorMemberQuestion(item) {
  const answer = MAIN_SECTORS.find((id) => SECTORS[id].numbers.includes(item.n));
  const run = SECTORS[answer].runs.find((r) => r.includes(item.n));
  return {
    answer,
    answerType: 'choice',
    options: MAIN_SECTORS.map((id) => ({ value: id, label: [{ sector: id }] })),
    prompt: ['Which sector holds ', { n: item.n }, '?'],
    wheel: { view: 'full', focus: item.n, revealed: [item.n], band: [], unknown: [] },
    feedback: { highlight: run, relation: [{ n: item.n }, ' · ', { sector: answer }] },
  };
}

function sectorEdgeQuestion(item, { recall, rng }) {
  const run = SECTORS[item.sector].runs[item.run];
  const startsAtHead = (item.edge === 'first') === (item.dir === 'CW');
  const answer = startsAtHead ? run[0] : run.at(-1);
  const base = {
    prompt: [{ sector: item.sector }, `: ${item.edge} number going `, { dir: item.dir }],
    wheel: { view: 'full', focus: answer, revealed: [], band: run, unknown: [answer] },
    feedback: {
      highlight: [answer],
      relation: [{ sector: item.sector }, ` ${item.edge} `, { dir: item.dir }, ' · ', { n: answer }],
    },
  };
  return numberQuestion(base, { answer, exclude: [], recall, rng });
}

function arcStepQuestion(item, { recall, rng }) {
  const base = {
    prompt: ['Next ', { dir: item.dir }, ' of ', { n: item.from }],
    wheel: { view: 'arc', focus: item.from, revealed: [item.from], band: [], unknown: [item.to] },
    feedback: {
      highlight: item.dir === 'CW' ? [item.from, item.to] : [item.to, item.from],
      relation: ringRelation(item.from, item.to, item.dir),
    },
  };
  return numberQuestion(base, { answer: item.to, exclude: [item.from], recall, rng });
}

function arcMissingQuestion(item, { recall, rng }) {
  const arc = arcById(item.arc);
  const others = arc.numbers.filter((n) => n !== item.n);
  const base = {
    prompt: ['Which number is missing?'],
    wheel: { view: 'arc', focus: arc.numbers[Math.floor(arc.numbers.length / 2)], revealed: others, band: [], unknown: [item.n] },
    feedback: { highlight: arc.numbers, relation: arc.numbers.flatMap((n, i) => (i ? [' ', { n }] : [{ n }])) },
  };
  return numberQuestion(base, { answer: item.n, exclude: others, recall, rng });
}

function permutations(list) {
  if (list.length <= 1) return [list];
  return list.flatMap((x, i) => permutations([...list.slice(0, i), ...list.slice(i + 1)]).map((p) => [x, ...p]));
}

// Wrong orderings first; if the arc is too short for three, swap in a near neighbor from outside.
function sequenceDistractors(answer, start, rng) {
  const key = (seq) => seq.join(',');
  const reordered = shuffled(permutations(answer).filter((p) => key(p) !== key(answer)), rng);
  const outside = distractors(answer.at(-1), [start, ...answer], rng, OPTION_COUNT);
  const substituted = outside.map((n) => [...answer.slice(0, -1), n]);
  return [...reordered, ...substituted].slice(0, OPTION_COUNT - 1);
}

function arcCompleteQuestion(item, { recall, rng }) {
  const arc = arcById(item.arc);
  const ordered = item.dir === 'CW' ? arc.numbers : [...arc.numbers].reverse();
  const [start, ...answer] = ordered;
  const options = recall ? null : shuffled([answer, ...sequenceDistractors(answer, start, rng)], rng)
    .map((value) => ({ value, label: value.flatMap((n, i) => (i ? [' ', { n }] : [{ n }])) }));
  return {
    answer,
    answerType: recall ? 'sequence' : 'choice',
    options,
    prompt: ['Complete the arc from ', { n: start }, ' going ', { dir: item.dir }],
    wheel: { view: 'arc', focus: arc.numbers[Math.floor(arc.numbers.length / 2)], revealed: [start], band: arc.numbers, unknown: [] },
    feedback: { highlight: arc.numbers, relation: arc.numbers.flatMap((n, i) => (i ? [' ', { n }] : [{ n }])) },
  };
}

const between = (rng, min, max) => min + Math.floor(rng() * (max - min + 1));
const walk = (from, count, dir) => Array.from({ length: count }, (_, i) => step(from, i + 1, dir));
const joined = (numbers, glue) => numbers.flatMap((n, i) => (i ? [glue, { n }] : [{ n }]));

function chainQuestion(item, { recall, rng }) {
  const answer = walk(item.n, between(rng, 2, 5), item.dir);
  const options = recall ? null : shuffled([answer, ...sequenceDistractors(answer, item.n, rng)], rng)
    .map((value) => ({ value, label: joined(value, ' ') }));
  const ring = item.dir === 'CW' ? [item.n, ...answer] : [...answer].reverse().concat(item.n);
  return {
    answer,
    answerType: recall ? 'sequence' : 'choice',
    options,
    prompt: ['Continue ', { dir: item.dir }, ' from ', { n: item.n }, ` · ${answer.length} numbers`],
    wheel: { view: 'arc', focus: item.n, revealed: [item.n], band: [], unknown: [] },
    feedback: { highlight: ring, relation: joined(ring, item.dir === 'CW' ? ' → ' : ' ← ') },
  };
}

function distStepQuestion(item, { recall, rng }) {
  const k = item.band === 'near' ? between(rng, 2, 4) : between(rng, 5, 9);
  const path = walk(item.n, k, item.dir);
  const answer = path.at(-1);
  const base = {
    prompt: [`${k} pockets `, { dir: item.dir }, ' of ', { n: item.n }],
    wheel: { view: 'full', focus: item.n, revealed: [item.n], band: [], unknown: [answer] },
    feedback: { highlight: [item.n, ...path], relation: [{ n: item.n }, ` +${k} `, { dir: item.dir }, ' · ', { n: answer }] },
  };
  return numberQuestion(base, { answer, exclude: [item.n], recall, rng });
}

const DISTANCE_MIN = 2;
const DISTANCE_MAX = 9;
const distanceOption = (k, dir) => ({ value: `${k}:${dir}`, label: [`${k} `, { dir }] });

function distCountQuestion(item, { recall, rng }) {
  const k = between(rng, DISTANCE_MIN, DISTANCE_MAX);
  const dir = DIRECTIONS[between(rng, 0, 1)];
  const other = dir === 'CW' ? 'CCW' : 'CW';
  const target = step(item.n, k, dir);
  const range = Array.from({ length: DISTANCE_MAX - DISTANCE_MIN + 1 }, (_, i) => i + DISTANCE_MIN);
  const all = DIRECTIONS.flatMap((d) => range.map((n) => distanceOption(n, d)));
  const wrongK = k === DISTANCE_MAX ? k - 1 : k + 1;
  const few = shuffled([distanceOption(k, dir), distanceOption(k, other), distanceOption(wrongK, dir), distanceOption(wrongK, other)], rng);
  return {
    answer: `${k}:${dir}`,
    answerType: 'choice',
    options: recall ? all : few,
    prompt: ['From ', { n: item.n }, ' to ', { n: target }, ': pockets, shorter way?'],
    wheel: { view: 'full', focus: item.n, revealed: [item.n], band: [], unknown: [] },
    feedback: { highlight: [item.n, ...walk(item.n, k, dir)], relation: [{ n: item.n }, ` +${k} `, { dir }, ' · ', { n: target }] },
  };
}

const NEIGHBOR_SPAN = 4;
const NEIGHBOR_DECOYS = 6;

function neighborsQuestion(item, { rng }) {
  const answer = [...walk(item.n, NEIGHBOR_SPAN, 'CCW').reverse(), ...walk(item.n, NEIGHBOR_SPAN, 'CW')];
  const outer = DIRECTIONS.flatMap((d) => walk(item.n, NEIGHBOR_SPAN * 2, d).slice(NEIGHBOR_SPAN));
  const decoys = shuffled(outer, rng).slice(0, NEIGHBOR_DECOYS);
  return {
    answer,
    answerType: 'multi',
    options: shuffled([...answer, ...decoys], rng).map((value) => ({ value, label: [{ n: value }] })),
    prompt: ['Select the ±4 neighbors of ', { n: item.n }],
    wheel: { view: 'arc', focus: item.n, revealed: [item.n], band: [], unknown: [] },
    feedback: { highlight: [...answer, item.n], relation: joined([...answer.slice(0, 4), item.n, ...answer.slice(4)], ' ') },
  };
}

function positionQuestion(item, { rng }) {
  const anchor = step(item.n, between(rng, 3, 12), DIRECTIONS[between(rng, 0, 1)]);
  const naming = item.kind === 'posName';
  return {
    answer: item.n,
    answerType: naming ? 'keypad' : 'tap',
    options: null,
    prompt: naming ? ['Which number is here?'] : ['Tap the pocket of ', { n: item.n }],
    wheel: { view: 'full', focus: item.n, revealed: [anchor], band: [], unknown: naming ? [item.n] : [] },
    feedback: { highlight: [item.n], relation: [{ n: anchor }, ' … ', { n: item.n }] },
  };
}

// Stage 7 ladder: exposure shortens, the highlight band disappears, then two numbers are hidden.
const SEGMENT_LEVELS = Object.freeze([
  { exposureMs: null, hidden: 1, band: true },
  { exposureMs: 4000, hidden: 1, band: true },
  { exposureMs: 2500, hidden: 1, band: false },
  { exposureMs: 1500, hidden: 2, band: false },
  { exposureMs: 900, hidden: 2, band: false },
]);

function segmentQuestion(item, { recall, rng, level = 0 }) {
  const rung = SEGMENT_LEVELS[Math.min(level, SEGMENT_LEVELS.length - 1)];
  // With two numbers hidden, keep at least two visible anchors.
  const length = between(rng, rung.hidden === 2 ? 4 : 3, 5);
  const start = step(item.n, between(rng, 0, length - 1), 'CCW');
  const segment = [start, ...walk(start, length - 1, 'CW')];
  const extra = shuffled(segment.filter((n) => n !== item.n), rng).slice(0, rung.hidden - 1);
  const hidden = segment.filter((n) => n === item.n || extra.includes(n));
  const shown = segment.filter((n) => !hidden.includes(n));
  const base = {
    exposureMs: rung.exposureMs,
    prompt: [hidden.length === 1 ? 'Which number is hidden?' : 'Which two numbers are hidden? Clockwise.'],
    wheel: { view: 'arc', focus: segment[Math.floor(length / 2)], revealed: shown, band: rung.band ? segment : [], unknown: hidden },
    feedback: { highlight: segment, relation: joined(segment, ' ') },
  };
  if (hidden.length === 1) return numberQuestion(base, { answer: hidden[0], exclude: shown, recall, rng });
  const options = recall ? null : shuffled([hidden, ...sequenceDistractors(hidden, shown[0], rng)], rng)
    .map((value) => ({ value, label: joined(value, ' ') }));
  return { ...base, answer: hidden, answerType: recall ? 'sequence' : 'choice', options };
}

// Stage 8 ladder: seconds per revolution.
const ROTATION_SECONDS = Object.freeze([6, 5, 4, 3]);

// A ring turning clockwise brings the counter-clockwise neighbors to the marker, and vice versa.
function rotationAnswer({ atMarker, ahead, rotation }) {
  return ahead === 0 ? atMarker : step(atMarker, ahead, rotation === 'CW' ? 'CCW' : 'CW');
}

// The answer depends on the moment of the cue, so the question is completed by resolveLive().
function rotationQuestion(item, { recall, level = 0 }) {
  const seconds = ROTATION_SECONDS[Math.min(level, ROTATION_SECONDS.length - 1)];
  return {
    answer: null,
    answerType: recall ? 'keypad' : 'choice',
    options: null,
    live: { rotation: item.dir, ahead: item.ahead, secondsPerRev: seconds },
    prompt: item.ahead === 0
      ? ['Ring turns ', { dir: item.dir }, ' · on the cue, name the number at the marker']
      : ['Ring turns ', { dir: item.dir }, ` · on the cue, name the number arriving ${item.ahead} later`],
    wheel: { view: 'full', focus: 0, revealed: [], band: [], unknown: [] },
    feedback: { highlight: [], relation: [] },
  };
}

function resolveLive(question, atMarker, rng) {
  const { rotation, ahead } = question.live;
  const answer = rotationAnswer({ atMarker, ahead, rotation });
  const path = ahead === 0 ? [atMarker] : [atMarker, ...walk(atMarker, ahead, rotation === 'CW' ? 'CCW' : 'CW')];
  return {
    ...question,
    answer,
    options: question.answerType === 'choice' ? numberOptions(answer, [], rng) : null,
    feedback: { highlight: path, relation: ahead === 0 ? ['At the marker: ', { n: answer }] : [{ n: atMarker }, ` then +${ahead}: `, { n: answer }] },
  };
}

const BUILDERS = {
  segment: segmentQuestion,
  rotMarker: rotationQuestion,
  rotArrive: rotationQuestion,
  junctionStep: arcStepQuestion,
  chain: chainQuestion,
  distStep: distStepQuestion,
  distCount: distCountQuestion,
  neighbors: neighborsQuestion,
  posName: positionQuestion,
  posTap: positionQuestion,
  sectorMember: sectorMemberQuestion,
  sectorEdge: sectorEdgeQuestion,
  arcStep: arcStepQuestion,
  arcMissing: arcMissingQuestion,
  arcComplete: arcCompleteQuestion,
};

function buildQuestion(item, { recall, rng, level = 0 }) {
  const build = BUILDERS[item.kind];
  if (!build) throw new RangeError(`No question builder for item kind: ${item.kind}`);
  return { itemId: item.id, kind: item.kind, dir: item.dir, ...build(item, { recall, rng, level }) };
}

function isCorrectAnswer(question, given) {
  if (question.answerType === 'multi') {
    return Array.isArray(given) && given.length === question.answer.length
      && question.answer.every((n) => given.includes(n));
  }
  if (Array.isArray(question.answer)) {
    return Array.isArray(given)
      && given.length === question.answer.length
      && given.every((n, i) => n === question.answer[i]);
  }
  return given === question.answer;
}

// ---- benchmark.js ----
// Blank Wheel benchmark: one anchor is given, every other number is placed once, in random order.


function benchmarkOrder(rng) {
  const anchor = SEQUENCE[Math.floor(rng() * SEQUENCE.length)];
  return { anchor, order: shuffled(SEQUENCE.filter((n) => n !== anchor), rng) };
}

// ---- progress.js ----
// ProgressManager (pure part): schema, migrations, scoring rules, export/import format.
// Storage I/O lives in storage.js. Nothing here mutates its input.


const SCHEMA_VERSION = 1;
const APP_ID = 'roulette-wheel-trainer';
const STAGE_COUNT = 8;
const XP_PER_CORRECT = 10;
const XP_FAST_BONUS = 5;
const EXPLORE_UNLOCK_COUNT = 15;

const STAGE_WINDOW = 20;
const STAGE_PASS = 0.85;
const DIRECTION_PASS = 0.8;
const DIRECTION_MIN_ANSWERS = 5;
const BLOCK_WINDOW = 10;
const BLOCK_RECALL = 0.8;
const RECENT_KEPT = 40;
const BACKUP_STALE_DAYS = 7;
const SESSIONS_KEPT = 200;
// Stages whose difficulty adapts, with their highest level (see SEGMENT_LEVELS, ROTATION_SECONDS).
const ADAPTIVE_MAX_LEVEL = { 7: 4, 8: 3 };
const LEVEL_WINDOW = 10;
const LEVEL_UP = 0.85;
const LEVEL_DOWN = 0.7;
const KIND_LATENCIES_KEPT = 20;
const FAST_MIN_SAMPLES = 5;

function defaultProgress(now) {
  return {
    schema: SCHEMA_VERSION,
    createdAt: now,
    xp: 0,
    streak: 0,
    bestStreak: 0,
    stage: 1,
    unlocked: [1],
    completed: [],
    explored: [],
    introduced: [],
    items: {},
    blocks: {},
    stages: {},
    dirStats: { CW: { attempts: 0, correct: 0 }, CCW: { attempts: 0, correct: 0 } },
    benchmark: [],
    sessions: [],
    levels: {},
    kindLat: {},
    rt: { best: null, sum: 0, count: 0 },
    lastBackup: null,
    settings: { sound: false, sessionMin: 5, autoNext: true },
  };
}

// One entry per schema step; each takes version N data and returns version N+1 data.
// Migrations only add or reshape. They never drop fields.
const MIGRATIONS = {
  0: (data) => ({ ...data, schema: 1 }),
};

function migrate(data, now) {
  if (data === null || typeof data !== 'object') throw new TypeError('Progress data must be an object');
  let current = { ...data, schema: data.schema ?? 0 };
  if (current.schema > SCHEMA_VERSION) {
    throw new RangeError('This progress was saved by a newer app version. Update the app first.');
  }
  while (current.schema < SCHEMA_VERSION) current = MIGRATIONS[current.schema](current);
  const defaults = defaultProgress(now);
  return { ...defaults, ...current, settings: { ...defaults.settings, ...current.settings } };
}

const ratio = (list) => (list.length === 0 ? 0 : list.filter((r) => r.ok).length / list.length);
const stageWindow = (progress, stage) => (progress.stages[stage]?.recent ?? []).slice(-STAGE_WINDOW);

function stageAccuracy(progress, stage) {
  return ratio(stageWindow(progress, stage));
}

function stagePassed(progress, stage) {
  const recent = stageWindow(progress, stage);
  if (recent.length < STAGE_WINDOW || ratio(recent) < STAGE_PASS) return false;
  return ['CW', 'CCW'].every((dir) => {
    const answers = recent.filter((r) => r.dir === dir);
    return answers.length < DIRECTION_MIN_ANSWERS || ratio(answers) >= DIRECTION_PASS;
  });
}

function reactionTimeActive(progress, stage) {
  const recent = stageWindow(progress, stage);
  return recent.length >= STAGE_WINDOW && ratio(recent) >= STAGE_PASS;
}

function isRecallBlock(progress, kind) {
  return progress.blocks[kind]?.recall === true;
}

// Speed and exposure only tighten while accuracy holds, and ease off when it drops.
function adaptLevel(state, ok, maxLevel) {
  const recent = [...state.recent, ok];
  if (recent.length < LEVEL_WINDOW) return { level: state.level, recent };
  const accuracy = recent.filter(Boolean).length / recent.length;
  if (accuracy >= LEVEL_UP) return { level: Math.min(maxLevel, state.level + 1), recent: [] };
  if (accuracy < LEVEL_DOWN) return { level: Math.max(0, state.level - 1), recent: [] };
  return { level: state.level, recent: recent.slice(1) };
}

function stageLevel(progress, stage) {
  return progress.levels[stage]?.level ?? 0;
}

function median(list) {
  const sorted = [...list].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// "Fast" is relative to the learner's own median for that kind of question.
function isFastAnswer(progress, item, stage, latencyMs) {
  const history = progress.kindLat[item.kind] ?? [];
  return reactionTimeActive(progress, stage) && history.length >= FAST_MIN_SAMPLES && latencyMs < median(history);
}

function withUnlock(progress, stage) {
  if (stage > STAGE_COUNT || progress.unlocked.includes(stage)) return progress;
  return { ...progress, unlocked: [...progress.unlocked, stage] };
}

function updatedBlock(block, ok) {
  const recent = [...(block?.recent ?? []), { ok }].slice(-BLOCK_WINDOW);
  const reached = recent.length >= BLOCK_WINDOW && ratio(recent) >= BLOCK_RECALL;
  return { recent, recall: block?.recall === true || reached };
}

function recordAnswer(progress, { item, stage, ok, latencyMs, now }) {
  const streak = ok ? progress.streak + 1 : 0;
  const dir = item.dir;
  const dirStats = dir === null ? progress.dirStats : {
    ...progress.dirStats,
    [dir]: {
      attempts: progress.dirStats[dir].attempts + 1,
      correct: progress.dirStats[dir].correct + (ok ? 1 : 0),
    },
  };
  const recent = [...(progress.stages[stage]?.recent ?? []), { ok, dir }].slice(-RECENT_KEPT);
  const bonus = ok && isFastAnswer(progress, item, stage, latencyMs) ? XP_FAST_BONUS : 0;
  const maxLevel = ADAPTIVE_MAX_LEVEL[stage];
  const levels = maxLevel === undefined ? progress.levels
    : { ...progress.levels, [stage]: adaptLevel(progress.levels[stage] ?? { level: 0, recent: [] }, ok, maxLevel) };
  const rt = !ok ? progress.rt : {
    best: progress.rt.best === null ? latencyMs : Math.min(progress.rt.best, latencyMs),
    sum: progress.rt.sum + latencyMs,
    count: progress.rt.count + 1,
  };
  const kindLat = !ok ? progress.kindLat
    : { ...progress.kindLat, [item.kind]: [...(progress.kindLat[item.kind] ?? []), latencyMs].slice(-KIND_LATENCIES_KEPT) };
  const next = {
    ...progress,
    levels,
    rt,
    kindLat,
    xp: progress.xp + (ok ? XP_PER_CORRECT + bonus : 0),
    streak,
    bestStreak: Math.max(progress.bestStreak, streak),
    items: { ...progress.items, [item.id]: review(progress.items[item.id] ?? newItemState(), ok, now, latencyMs) },
    blocks: { ...progress.blocks, [item.kind]: updatedBlock(progress.blocks[item.kind], ok) },
    stages: { ...progress.stages, [stage]: { recent } },
    dirStats,
  };
  if (!stagePassed(next, stage)) return next;
  const completed = next.completed.includes(stage) ? next.completed : [...next.completed, stage];
  return withUnlock({ ...next, completed }, stage + 1);
}

function recordExplored(progress, value) {
  if (progress.explored.includes(value)) return progress;
  const next = { ...progress, explored: [...progress.explored, value] };
  return next.explored.length >= EXPLORE_UNLOCK_COUNT ? withUnlock(next, 2) : next;
}

function isIntroduced(progress, chunkId) {
  return progress.introduced.includes(chunkId);
}

function markIntroduced(progress, chunkId) {
  if (isIntroduced(progress, chunkId)) return progress;
  return { ...progress, introduced: [...progress.introduced, chunkId] };
}

function unlockStage(progress, stage) {
  return withUnlock(progress, stage);
}

function recordSession(progress, session) {
  return { ...progress, sessions: [...progress.sessions, session].slice(-SESSIONS_KEPT) };
}

const BENCHMARK_FROM_STAGE = 4;
const BENCHMARK_MASTERY_ERRORS = 2;
const BENCHMARKS_KEPT = 100;
const MASTERED_BOX = 4;

function benchmarkAvailable(progress) {
  return progress.unlocked.includes(BENCHMARK_FROM_STAGE);
}

function recordBenchmark(progress, result) {
  return { ...progress, benchmark: [...progress.benchmark, result].slice(-BENCHMARKS_KEPT) };
}

function benchmarkBest(progress) {
  return [...progress.benchmark].sort((a, b) => a.errors - b.errors || a.ms - b.ms)[0] ?? null;
}

function level1Mastered(progress) {
  const best = benchmarkBest(progress);
  return best !== null && best.errors <= BENCHMARK_MASTERY_ERRORS && progress.completed.includes(STAGE_COUNT);
}

function kindAccuracy(progress, kindList) {
  const states = Object.entries(progress.items).filter(([id]) => kindList.includes(itemById(id)?.kind)).map(([, s]) => s);
  const attempts = states.reduce((sum, s) => sum + s.attempts, 0);
  return attempts === 0 ? 0 : states.reduce((sum, s) => sum + s.correct, 0) / attempts;
}

function masteryBars(progress) {
  const dirRatio = (stat) => (stat.attempts === 0 ? 0 : stat.correct / stat.attempts);
  const mastered = Object.values(progress.items).filter((s) => s.box >= MASTERED_BOX).length;
  return [
    { label: 'Wheel mastery', value: mastered / allItems().length },
    { label: 'CW recognition', value: dirRatio(progress.dirStats.CW) },
    { label: 'CCW recognition', value: dirRatio(progress.dirStats.CCW) },
    { label: 'Distance', value: kindAccuracy(progress, DISTANCE_KINDS) },
    { label: 'Spatial recognition', value: kindAccuracy(progress, SPATIAL_KINDS) },
  ];
}

function serialize(progress, now) {
  return JSON.stringify({ app: APP_ID, exportedAt: now, progress }, null, 2);
}

function parseImport(text, now) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    throw new SyntaxError('This file is not a valid JSON backup.');
  }
  if (parsed?.app !== APP_ID || typeof parsed.progress !== 'object' || parsed.progress === null) {
    throw new TypeError('This file is not a Roulette Wheel Trainer backup.');
  }
  return migrate(parsed.progress, now);
}

function backupIsStale(progress, now) {
  if (progress.xp === 0 && Object.keys(progress.items).length === 0) return false;
  return now - (progress.lastBackup ?? progress.createdAt) > BACKUP_STALE_DAYS * DAY_MS;
}

// ---- storage.js ----
// Storage I/O: IndexedDB is the primary store, localStorage a mirror/fallback.
// Both hold the same versioned object. Failures are reported, never swallowed silently.


const DB_NAME = APP_ID;
const STORE = 'progress';
const KEY = 'current';
const LS_KEY = `${APP_ID}:progress`;

function openDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function idbRequest(mode, action) {
  return openDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const request = action(tx.objectStore(STORE));
    tx.oncomplete = () => { db.close(); resolve(request.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}

function readLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (error) {
    console.warn('localStorage read failed', error);
    return null;
  }
}

function writeLocal(progress) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(progress));
    return true;
  } catch (error) {
    console.warn('localStorage write failed', error);
    return false;
  }
}

// Returns { progress | null, warning | null }. A newer-schema save is left untouched.
async function loadProgress(now) {
  let stored = null;
  try {
    stored = await idbRequest('readonly', (store) => store.get(KEY));
  } catch (error) {
    console.warn('IndexedDB read failed, falling back to localStorage', error);
  }
  const raw = stored ?? readLocal();
  if (!raw) return { progress: null, warning: null };
  try {
    return { progress: migrate(raw, now), warning: null };
  } catch (error) {
    return { progress: null, warning: error.message, locked: true };
  }
}

async function saveProgress(progress) {
  const mirrored = writeLocal(progress);
  try {
    await idbRequest('readwrite', (store) => store.put(progress, KEY));
    return true;
  } catch (error) {
    console.warn('IndexedDB write failed', error);
    return mirrored;
  }
}

async function clearProgress() {
  try { localStorage.removeItem(LS_KEY); } catch (error) { console.warn('localStorage clear failed', error); }
  try { await idbRequest('readwrite', (store) => store.delete(KEY)); } catch (error) { console.warn('IndexedDB clear failed', error); }
}

async function requestDurableStorage() {
  try {
    if (!navigator.storage?.persist) return false;
    return (await navigator.storage.persisted()) || (await navigator.storage.persist());
  } catch (error) {
    console.warn('Durable storage request failed', error);
    return false;
  }
}

// Hands the backup to the share sheet (iOS: Save to Files); falls back to a download.
async function shareBackup(progress, now) {
  const name = `wheel-trainer-backup-${new Date(now).toISOString().slice(0, 10)}.json`;
  const file = new File([serialize(progress, now)], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Roulette Wheel Trainer backup' });
      return true;
    } catch (error) {
      if (error.name === 'AbortError') return false;
      console.warn('Share failed, falling back to download', error);
    }
  }
  const url = URL.createObjectURL(file);
  const link = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

// ---- renderer.js ----
// WheelRenderer: one SVG, two layers. The rotor layer turns with a single rotorAngle;
// the stationary layer never rotates (marker now; diamonds and ball track in later levels).


const SVG_NS = 'http://www.w3.org/2000/svg';
const R_RIM = 200;
const R_NUM_OUT = 186;
const R_NUM_IN = 140;
const R_POCKET_IN = 98;
const R_TEXT = 163;
const ARC_VIEW_SIZE = 250;
const FULL_VIEW = `${-R_RIM - 6} ${-R_RIM - 6} ${2 * R_RIM + 12} ${2 * R_RIM + 12}`;
const TAP_SLOP_PX = 8;

const toRad = (deg) => ((deg - 90) * Math.PI) / 180;
const polar = (r, deg) => [r * Math.cos(toRad(deg)), r * Math.sin(toRad(deg))];

function svgEl(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  if (parent) parent.appendChild(node);
  return node;
}

function wedgePath(rOuter, rInner, a0, a1) {
  const [x0, y0] = polar(rOuter, a0);
  const [x1, y1] = polar(rOuter, a1);
  const [x2, y2] = polar(rInner, a1);
  const [x3, y3] = polar(rInner, a0);
  return `M${x0} ${y0}A${rOuter} ${rOuter} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${rInner} ${rInner} 0 0 0 ${x3} ${y3}Z`;
}

function drawPocket(rotor, p) {
  const a0 = p.angle - POCKET_ANGLE / 2;
  const a1 = p.angle + POCKET_ANGLE / 2;
  const g = svgEl('g', { class: `pocket shade-${p.color}`, 'data-n': p.value }, rotor);
  svgEl('path', { class: 'pocket-num', d: wedgePath(R_NUM_OUT, R_NUM_IN, a0, a1) }, g);
  svgEl('path', { class: 'pocket-well', d: wedgePath(R_NUM_IN, R_POCKET_IN, a0, a1) }, g);
  // Radial numerals: the foot of each digit points at the hub, as on a real rotor.
  const text = svgEl('text', { class: 'numeral', transform: `rotate(${p.angle}) translate(0 ${-R_TEXT})` }, g);
  text.textContent = p.value;
  const hidden = svgEl('text', { class: 'numeral-unknown', transform: `rotate(${p.angle}) translate(0 ${-R_TEXT})` }, g);
  hidden.textContent = '?';
  return g;
}

function createWheel(container, { onTap, onRotate }) {
  const svg = svgEl('svg', { class: 'wheel', viewBox: FULL_VIEW, role: 'img', 'aria-label': 'European roulette wheel' }, container);
  const stationaryBack = svgEl('g', { class: 'layer-stationary' }, svg);
  svgEl('circle', { class: 'rim', r: R_RIM }, stationaryBack);
  const rotor = svgEl('g', { class: 'layer-rotor' }, svg);
  const pockets = new Map(POCKETS.map((p) => [p.value, drawPocket(rotor, p)]));
  svgEl('circle', { class: 'hub', r: R_POCKET_IN }, rotor);
  svgEl('circle', { class: 'hub-cap', r: 30 }, rotor);
  [0, 90, 180, 270].forEach((a) => svgEl('line', { class: 'hub-spoke', x1: 0, y1: -30, x2: 0, y2: -R_POCKET_IN + 8, transform: `rotate(${a})` }, rotor));
  const stationaryFront = svgEl('g', { class: 'layer-stationary' }, svg);
  const marker = svgEl('path', { class: 'marker', d: `M0 ${-R_NUM_OUT + 4}L-7 ${-R_RIM - 4}L7 ${-R_RIM - 4}Z`, visibility: 'hidden' }, stationaryFront);

  let rotorAngle = 0;
  // In arc view the zoom window is fixed in place; the ring slides through it when the rotor turns.
  let view = { mode: 'full', windowAngle: 0 };

  function applyView() {
    if (view.mode === 'full') return svg.setAttribute('viewBox', FULL_VIEW);
    const [cx, cy] = polar(R_TEXT - 18, view.windowAngle);
    svg.setAttribute('viewBox', `${cx - ARC_VIEW_SIZE / 2} ${cy - ARC_VIEW_SIZE / 2} ${ARC_VIEW_SIZE} ${ARC_VIEW_SIZE}`);
  }

  function setRotorAngle(angle) {
    rotorAngle = ((angle % 360) + 360) % 360;
    rotor.setAttribute('transform', `rotate(${rotorAngle})`);
  }

  // atTop: turn the rotor so the focus pocket sits upright at 12 o'clock and zoom in there.
  function setView(mode, focus, { atTop = false } = {}) {
    if (atTop && focus !== undefined) setRotorAngle(-pocket(focus).angle);
    view = { mode, windowAngle: focus === undefined ? view.windowAngle : pocket(focus).angle + rotorAngle };
    svg.classList.toggle('is-arc', mode === 'arc');
    applyView();
  }

  // Presentation: which numerals show, which pockets carry a band, "?" or highlight.
  function present({ hideNumbers = false, revealed = [], band = [], unknown = [], highlight = [], wrong = [] }) {
    pockets.forEach((g, n) => {
      g.classList.toggle('is-hidden', hideNumbers && !revealed.includes(n));
      g.classList.toggle('is-band', band.includes(n));
      g.classList.toggle('is-unknown', unknown.includes(n));
      g.classList.toggle('is-lit', highlight.includes(n));
      g.classList.toggle('is-wrong', wrong.includes(n));
    });
  }

  function pointerAngle(event) {
    const ctm = svg.getScreenCTM();
    const x = (event.clientX - ctm.e) / ctm.a;
    const y = (event.clientY - ctm.f) / ctm.d;
    return (Math.atan2(y, x) * 180) / Math.PI;
  }

  let drag = null;
  svg.addEventListener('pointerdown', (event) => {
    drag = { x: event.clientX, y: event.clientY, startPointer: pointerAngle(event), startRotor: rotorAngle, moved: false };
    svg.setPointerCapture(event.pointerId);
  });
  svg.addEventListener('pointermove', (event) => {
    if (!drag) return;
    if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > TAP_SLOP_PX) drag.moved = true;
    if (!drag.moved || !onRotate) return;
    setRotorAngle(drag.startRotor + pointerAngle(event) - drag.startPointer);
    onRotate(rotorAngle);
  });
  svg.addEventListener('pointerup', (event) => {
    const wasTap = drag && !drag.moved;
    drag = null;
    if (!wasTap || !onTap) return;
    const hit = document.elementFromPoint(event.clientX, event.clientY)?.closest?.('.pocket');
    if (hit) onTap(Number(hit.dataset.n));
  });
  svg.addEventListener('pointercancel', () => { drag = null; });

  return {
    setRotorAngle,
    setView,
    present,
    getRotorAngle: () => rotorAngle,
    showMarker: (visible) => marker.setAttribute('visibility', visible ? 'visible' : 'hidden'),
  };
}

// ---- ui.js ----
// UI helpers: DOM builder and the chips that keep number shading consistent everywhere.


const STAGES = Object.freeze([
  { n: 1, title: 'Explore', note: 'Drag the wheel, tap numbers' },
  { n: 2, title: 'Sectors', note: 'Voisins · Tiers · Orphelins' },
  { n: 3, title: 'Arcs', note: 'Nine arcs, both directions' },
  { n: 4, title: 'Junctions & full ring', note: 'Arc boundaries and chains' },
  { n: 5, title: 'Distance', note: 'Pockets apart, both directions' },
  { n: 6, title: 'Position', note: 'Blank wheel, one anchor' },
  { n: 7, title: 'Segment recognition', note: 'Short glimpses, hidden numbers' },
  { n: 8, title: 'Slow rotation', note: 'Read the turning ring at the marker' },
]);
const PLAYABLE_STAGES = Object.freeze([1, 2, 3, 4, 5, 6, 7, 8]);

function h(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  Object.entries(props).forEach(([key, value]) => {
    if (value === undefined || value === null || value === false) return;
    if (key === 'class') node.className = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
    else node.setAttribute(key, value === true ? '' : value);
  });
  children.flat().forEach((child) => {
    if (child === null || child === undefined || child === false) return;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  });
  return node;
}

// The only way a number is ever shown outside the wheel: always in its own shade.
function numberChip(n) {
  return h('span', { class: `chip shade-${pocket(n).color}` }, n);
}

function dirBadge(dir) {
  return h('span', { class: `dir dir-${dir.toLowerCase()}` }, dir === 'CW' ? '↻ CW' : '↺ CCW');
}

function renderParts(parts) {
  return parts.map((part) => {
    if (typeof part === 'string') return part;
    if (part.n !== undefined) return numberChip(part.n);
    if (part.dir) return dirBadge(part.dir);
    if (part.sector) return h('span', { class: 'sector-name' }, SECTORS[part.sector].short);
    return '';
  });
}

function formatClock(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

function formatSeconds(ms) {
  return `${(ms / 1000).toFixed(2)} s`;
}

function percent(ratio) {
  return `${Math.round(ratio * 100)}%`;
}

// ---- audio.js ----
// AudioManager: three subtle synthesized tones. Silent unless the sound setting is on.

const TONES = {
  ok: [{ hz: 660, at: 0, ms: 70 }, { hz: 880, at: 0.08, ms: 90 }],
  miss: [{ hz: 233, at: 0, ms: 160 }],
  cue: [{ hz: 520, at: 0, ms: 60 }],
};
const TONE_GAIN = 0.06;

let audioContext = null;

function playTone(name, enabled) {
  if (!enabled) return;
  try {
    audioContext ??= new (window.AudioContext ?? window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
    TONES[name].forEach(({ hz, at, ms }) => {
      const start = audioContext.currentTime + at;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = hz;
      gain.gain.setValueAtTime(TONE_GAIN, start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + ms / 1000);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(start);
      oscillator.stop(start + ms / 1000);
    });
  } catch (error) {
    console.warn('Audio unavailable', error);
  }
}

// ---- app.js ----
// App: screens and the training loop. All rules live in the pure modules; this file wires them to the DOM.


const SESSION_LENGTHS = [3, 5, 10];
const CORRECT_PAUSE_MS = 2200;
// After a miss nothing advances by itself, and Next ignores taps briefly so a double-tap cannot skip the answer.
const MISS_NEXT_GUARD_MS = 1200;
const WEAK_SPOT_LIMIT = 5;
const BENCHMARK_TREND_COUNT = 8;
const BENCHMARK_REVEAL_MS = 700;
const CUE_DELAY_MIN_MS = 1500;
const CUE_DELAY_MAX_MS = 4000;
const root = document.getElementById('app');

let progress = null;
let storageLocked = false;
let session = null;
let keyHandler = null;

function commit(next) {
  progress = next;
  if (!storageLocked) saveProgress(progress);
}

function isFresh() {
  return progress.xp === 0 && Object.keys(progress.items).length === 0 && progress.explored.length === 0;
}

function header() {
  return h('header', { class: 'app-header' },
    h('div', { class: 'brand' }, h('strong', {}, 'ROULETTE WHEEL TRAINER'), h('span', {}, 'Level 1 · Learn the Wheel')),
    h('div', { class: 'level' }, 'Level 1 / 10', h('div', { class: 'level-bar' },
      h('i', { style: `transform:scaleX(${progress.completed.length / STAGES.length})` }))));
}

function show(...nodes) {
  document.removeEventListener('keydown', keyHandler);
  keyHandler = null;
  root.replaceChildren(header(), ...nodes);
}

function onKeys(handler) {
  keyHandler = handler;
  document.addEventListener('keydown', keyHandler);
}

/* ---------- Home ---------- */

async function importFile(file) {
  try {
    commit(parseImport(await file.text(), Date.now()));
    showHome('Progress imported.');
  } catch (error) {
    showHome(error.message);
  }
}

function importButton(label, cls) {
  const input = h('input', { type: 'file', accept: 'application/json,.json', class: 'visually-hidden',
    onChange: (event) => event.target.files[0] && importFile(event.target.files[0]) });
  return h('label', { class: `btn ${cls}` }, label, input);
}

async function saveBackup(after) {
  if (await shareBackup(progress, Date.now())) commit({ ...progress, lastBackup: Date.now() });
  after();
}

function stageRow(stage) {
  const unlocked = progress.unlocked.includes(stage.n);
  const playable = unlocked && PLAYABLE_STAGES.includes(stage.n);
  const done = progress.completed.includes(stage.n);
  const accuracy = stage.n > 1 && progress.stages[stage.n] ? percent(stageAccuracy(progress, stage.n)) : '';
  return h('button', { class: `stage-row${done ? ' is-done' : ''}`, disabled: !playable,
    onClick: () => (stage.n === 1 ? showExplore() : startSession(stage.n)) },
    h('span', { class: 'stage-n' }, done ? '✓' : unlocked ? stage.n : '🔒'),
    h('span', { class: 'stage-text' }, h('strong', {}, stage.title), h('small', {}, stage.note)),
    h('span', { class: 'stage-acc' }, accuracy));
}

function benchmarkRow() {
  const open = benchmarkAvailable(progress);
  const best = benchmarkBest(progress);
  const note = best ? `Best: ${best.errors} error${best.errors === 1 ? '' : 's'} · ${formatClock(best.ms)}` : 'Place all 37 numbers. Opens with stage 4.';
  return h('button', { class: 'stage-row benchmark-row', disabled: !open, onClick: showBenchmark },
    h('span', { class: 'stage-n' }, open ? '◎' : '🔒'),
    h('span', { class: 'stage-text' }, h('strong', {}, 'Blank Wheel benchmark'), h('small', {}, note)),
    h('span', { class: 'stage-acc' }, progress.benchmark.length ? `${progress.benchmark.length}×` : ''));
}

function showHome(message) {
  const lengths = h('div', { class: 'segmented', role: 'group', 'aria-label': 'Session length' },
    SESSION_LENGTHS.map((min) => h('button', { class: progress.settings.sessionMin === min ? 'is-on' : '',
      onClick: () => { commit({ ...progress, settings: { ...progress.settings, sessionMin: min } }); showHome(); } }, `${min} min`)));
  show(h('main', { class: 'screen home' },
    message && h('p', { class: 'notice' }, message),
    level1Mastered(progress) && h('p', { class: 'notice' }, 'Level 1 mastered: benchmark within 2 errors and slow rotation passed.'),
    storageLocked && h('p', { class: 'notice' }, 'Saved progress comes from a newer app version. It is untouched; nothing will be saved until the app updates.'),
    backupIsStale(progress, Date.now()) && h('div', { class: 'notice' }, 'Last backup is more than 7 days old. ',
      h('button', { class: 'link', onClick: () => saveBackup(() => showHome()) }, 'Save backup')),
    isFresh() && h('section', { class: 'welcome' }, h('p', {}, 'New here, or moved from another device?'),
      importButton('Import progress', 'btn-ghost')),
    h('div', { class: 'stat-line' }, h('span', {}, `${progress.xp} XP`), progress.streak > 1 && h('span', {}, `🔥 STREAK ${progress.streak}`)),
    h('section', { class: 'stage-list' }, STAGES.map(stageRow)),
    benchmarkRow(),
    h('div', { class: 'home-foot' }, h('span', { class: 'label' }, 'Session'), lengths,
      h('button', { class: 'btn btn-ghost', onClick: showSettings }, 'Settings'))));
}

/* ---------- Stage 1: Explore ---------- */

function showExplore() {
  const info = h('p', { class: 'explore-info' }, 'Drag to rotate. Tap a number.');
  const count = h('small', { class: 'explore-count' });
  const mount = h('div', { class: 'wheel-mount' });
  let mode = 'full';
  let selected = null;
  const wheel = createWheel(mount, {
    onRotate: () => {},
    onTap: (n) => {
      selected = n;
      const { ccw, cw } = neighbors(n, 1);
      wheel.present({ highlight: [ccw[0], n, cw[0]] });
      const p = pocket(n);
      const sector = SECTORS[MAIN_SECTORS.find((id) => p.sectors.includes(id))].name;
      const zero = p.sectors.includes('zerospiel') ? ' · Zero-Spiel' : '';
      info.replaceChildren(numberChip(n), ' sits between ', numberChip(ccw[0]), ' and ', numberChip(cw[0]),
        h('small', {}, `${sector}${zero} · Arc ${p.arc}`));
      commit(recordExplored(progress, n));
      updateCount();
    },
  });
  function updateCount() {
    const left = EXPLORE_UNLOCK_COUNT - progress.explored.length;
    count.textContent = progress.unlocked.includes(2) ? 'Sectors unlocked.' : `Explore ${left} more numbers to unlock Sectors.`;
  }
  const toggle = h('button', { class: 'btn btn-ghost', onClick: () => {
    mode = mode === 'full' ? 'arc' : 'full';
    wheel.setView(mode, selected ?? 0, { atTop: mode === 'arc' });
    toggle.textContent = mode === 'full' ? 'Arc view' : 'Full wheel';
  } }, 'Arc view');
  const sectorButtons = h('div', { class: 'segmented sector-tabs', role: 'group', 'aria-label': 'Show a sector' },
    Object.values(SECTORS).map((sector) => h('button', { onClick: () => {
      wheel.present({ highlight: sector.numbers });
      if (mode === 'arc') wheel.setView('arc', sector.runs[0][Math.floor(sector.runs[0].length / 2)], { atTop: true });
      info.replaceChildren(h('strong', { class: 'sector-name' }, `${sector.name} · ${sector.numbers.length}`),
        h('span', { class: 'run-list' }, sector.runs.map((run) => h('span', { class: 'run' }, run.map(numberChip)))));
    } }, sector.short)));
  updateCount();
  show(h('main', { class: 'screen train' }, mount, sectorButtons, info, count,
    h('div', { class: 'answers row' }, toggle,
      h('button', { class: 'btn', onClick: () => { commit(unlockStage(progress, 2)); showHome(); } },
        progress.unlocked.includes(2) ? 'Done' : 'Skip to Sectors'))));
}

/* ---------- Training session ---------- */

function startSession(stage) {
  session = { stage, startedAt: Date.now(), endsAt: Date.now() + progress.settings.sessionMin * 60_000,
    asked: 0, correct: 0, queue: [], lastId: null, latencies: [], hitLatencies: [], misses: {} };
  commit({ ...progress, stage });
  nextQuestion();
}

function nextQuestion() {
  if (Date.now() >= session.endsAt) return showSummary();
  const id = pickNext({ ids: stageItems(session.stage).map((i) => i.id), states: progress.items, now: Date.now(),
    queue: session.queue, asked: session.asked, lastId: session.lastId });
  const item = itemById(id);
  const chunk = studyChunk(item);
  if (chunk && !isIntroduced(progress, chunk.id)) return showStudyCard(chunk);
  session.queue = session.queue.filter((q) => q.id !== id);
  const question = buildQuestion(item, { recall: isRecallBlock(progress, item.kind), rng: Math.random, level: stageLevel(progress, session.stage) });
  showQuestion(item, question);
}

// Teach before testing: the first time a sector, arc or junction comes up, show it in full.
function showStudyCard(chunk) {
  const pausedAt = Date.now();
  const numbers = chunk.runs.flat();
  const mount = h('div', { class: 'wheel-mount' });
  const wheel = createWheel(mount, { onRotate: () => {} });
  wheel.setRotorAngle(randomRotorAngle(Math.random));
  wheel.setView(chunk.view, chunk.focus);
  wheel.present({ hideNumbers: true, revealed: numbers, band: numbers, highlight: chunk.mark });
  const done = () => {
    session.endsAt += Date.now() - pausedAt;
    commit(markIntroduced(progress, chunk.id));
    nextQuestion();
  };
  show(h('main', { class: 'screen train' },
    h('div', { class: 'stat-line' }, h('span', {}, 'STUDY · not scored, clock paused'), h('span', {}, 'Drag to turn')),
    mount,
    h('p', { class: 'prompt' }, h('strong', { class: 'sector-name' }, chunk.title),
      h('small', {}, `${numbers.length} numbers, clockwise. Read them in both directions.`)),
    h('div', { class: 'run-list' }, chunk.runs.map((run) => h('span', { class: 'run' }, run.map(numberChip)))),
    h('div', { class: 'answers' }, h('button', { class: 'btn btn-wide', onClick: done }, 'Got it · start questions'))));
  onKeys((event) => { if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); done(); } });
}

function keypad(question, submit) {
  const needed = Array.isArray(question.answer) ? question.answer.length : 1;
  const entered = [];
  let digits = '';
  const display = h('div', { class: 'keypad-display' });
  const redraw = () => display.replaceChildren(...entered.map(numberChip), h('span', { class: 'typing' }, digits || (entered.length ? '' : '–')));
  function press(key) {
    if (key === '⌫') digits = digits.slice(0, -1);
    else if (key === 'OK') {
      const value = Number(digits);
      if (digits === '' || value > 36) { digits = ''; return redraw(); }
      entered.push(value);
      digits = '';
      if (entered.length === needed) return submit(needed === 1 ? entered[0] : entered);
    } else if (digits.length < 2) digits += key;
    redraw();
  }
  redraw();
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'OK'];
  const pad = h('div', { class: 'keypad' }, keys.map((k) => h('button', { class: k === 'OK' ? 'key key-ok' : 'key', onClick: () => press(k) }, k)));
  return { node: h('div', {}, display, pad), press };
}

function showQuestion(item, question) {
  const mount = h('div', { class: 'wheel-mount' });
  const wheel = createWheel(mount, { onTap: (n) => question.answerType === 'tap' && submit(n) });
  wheel.setRotorAngle(randomRotorAngle(Math.random));
  wheel.setView(question.wheel.view, question.wheel.focus);
  wheel.present({ hideNumbers: !question.live, ...question.wheel });
  wheel.showMarker(Boolean(question.live));
  let frame = null;
  let exposureTimer = null;
  let cueAngle = null;
  const stopLive = () => { cancelAnimationFrame(frame); clearTimeout(exposureTimer); };

  // Stage 7: the segment is visible only for a moment. R or "Show again" replays the glimpse.
  function glimpse() {
    if (!question.exposureMs || answered) return;
    clearTimeout(exposureTimer);
    wheel.present({ hideNumbers: true, ...question.wheel });
    exposureTimer = setTimeout(() => !answered && wheel.present({ hideNumbers: true, ...question.wheel, revealed: [] }), question.exposureMs);
  }

  // Stage 8: the ring turns under the stationary marker; the cue fixes the answer.
  function startRotation() {
    const degPerMs = (360 / (question.live.secondsPerRev * 1000)) * (question.live.rotation === 'CW' ? 1 : -1);
    const startAngle = wheel.getRotorAngle();
    const startedAt = performance.now();
    const cueAt = startedAt + CUE_DELAY_MIN_MS + Math.random() * (CUE_DELAY_MAX_MS - CUE_DELAY_MIN_MS);
    const turn = (now) => {
      wheel.setRotorAngle(startAngle + (now - startedAt) * degPerMs);
      if (cueAngle === null && now >= cueAt) {
        cueAngle = wheel.getRotorAngle();
        question = resolveLive(question, pocketAtMarker(cueAngle), Math.random);
        wheel.present({ hideNumbers: true, revealed: [] });
        mount.classList.add('is-cued');
        playTone('cue', progress.settings.sound);
        shownAt = performance.now();
        mountAnswers();
      }
      frame = requestAnimationFrame(turn);
    };
    frame = requestAnimationFrame(turn);
  }

  const clock = h('span', { class: 'clock' });
  const tick = setInterval(() => { clock.textContent = formatClock(session.endsAt - Date.now()); }, 500);
  clock.textContent = formatClock(session.endsAt - Date.now());
  const feedback = h('div', { class: 'feedback', 'aria-live': 'polite' });
  const answers = h('div', { class: 'answers' });
  let shownAt = performance.now();
  let answered = false;
  let nextArmed = false;
  let advanced = false;

  function advance() {
    if (advanced) return;
    advanced = true;
    stopLive();
    clearInterval(tick);
    nextQuestion();
  }

  function submit(given) {
    if (answered) return;
    answered = true;
    const latencyMs = Math.round(performance.now() - shownAt);
    const ok = isCorrectAnswer(question, given);
    const fast = ok && isFastAnswer(progress, item, session.stage, latencyMs);
    stopLive();
    if (cueAngle !== null) wheel.setRotorAngle(cueAngle);
    playTone(ok ? 'ok' : 'miss', progress.settings.sound);
    session.asked += 1;
    session.lastId = item.id;
    session.latencies.push(latencyMs);
    if (ok) { session.correct += 1; session.hitLatencies.push(latencyMs); }
    else {
      session.queue = requeueMissed(session.queue, item.id, session.asked, Math.random);
      session.misses[item.id] = (session.misses[item.id] ?? 0) + 1;
    }
    commit(recordAnswer(progress, { item, stage: session.stage, ok, latencyMs, now: Date.now() }));
    const wrongPick = !ok && typeof given === 'number' ? [given] : [];
    wheel.present({ highlight: question.feedback.highlight, wrong: wrongPick, band: question.wheel.band });
    feedback.className = `feedback ${ok ? 'is-ok' : 'is-miss'}`;
    const timing = ok && reactionTimeActive(progress, session.stage)
      ? h('small', { class: 'rt' }, ` ${formatSeconds(latencyMs)}${fast ? ` · fast +${XP_FAST_BONUS} XP` : ''}`) : null;
    feedback.replaceChildren(h('strong', {}, ok ? '✓ ' : 'Not quite. Let’s lock this one in. '), ...renderParts(question.feedback.relation), timing);
    const next = h('button', { class: 'btn btn-wide', disabled: !ok, onClick: advance }, 'Next');
    answers.className = 'answers';
    answers.replaceChildren(next);
    statBar.replaceChildren(...statParts());
    if (!ok) setTimeout(() => { next.disabled = false; nextArmed = true; }, MISS_NEXT_GUARD_MS);
    else if (progress.settings.autoNext) setTimeout(() => root.contains(answers) && advance(), CORRECT_PAUSE_MS);
    nextArmed = ok;
  }

  let pad = null;
  function mountAnswers() {
  answers.replaceChildren();
  if (question.answerType === 'tap') {
    answers.append(h('p', { class: 'hint' }, 'Tap the wheel.'));
  } else if (question.answerType === 'multi') {
    const picked = new Set();
    const confirm = h('button', { class: 'btn btn-wide', disabled: true, onClick: () => submit([...picked]) }, 'Check');
    const chips = question.options.map((o) => {
      const button = h('button', { class: 'btn choice pick', 'aria-pressed': 'false', onClick: () => {
        if (picked.has(o.value)) picked.delete(o.value); else picked.add(o.value);
        button.setAttribute('aria-pressed', String(picked.has(o.value)));
        confirm.disabled = picked.size !== question.answer.length;
        confirm.textContent = `Check (${picked.size}/${question.answer.length})`;
      } }, ...renderParts(o.label));
      return button;
    });
    answers.append(h('div', { class: 'pick-grid' }, chips), confirm);
  } else if (question.answerType === 'choice') {
    const layout = question.options.length > 4 ? 'grid-4' : question.options.length === 3 || Array.isArray(question.answer) ? 'stack' : 'grid';
    answers.classList.add(layout);
    answers.append(...question.options.map((o, i) => h('button', { class: 'btn choice', onClick: () => submit(o.value) },
      h('kbd', {}, i + 1), ...renderParts(o.label))));
  } else {
    pad = keypad(question, submit);
    answers.append(pad.node);
  }
  if (question.exposureMs) answers.append(h('button', { class: 'link', onClick: glimpse }, 'Show again (R)'));
  }
  if (!question.live) mountAnswers();
  else answers.append(h('p', { class: 'hint' }, 'Watch the marker. Wait for the cue.'));

  const statParts = () => [clock, h('span', {}, progress.streak > 1 ? `🔥 STREAK ${progress.streak}` : ''), h('span', {}, `${progress.xp} XP`),
    h('button', { class: 'link', onClick: () => { stopLive(); clearInterval(tick); showSummary(); } }, 'Stop')];
  const statBar = h('div', { class: 'stat-line' }, statParts());

  show(h('main', { class: 'screen train' }, statBar, mount,
    h('p', { class: 'prompt' }, renderParts(question.prompt),
      ['keypad', 'sequence'].includes(question.answerType) && h('small', {}, Array.isArray(question.answer) ? ' · type each number, OK after each' : ' · type the number')),
    feedback, answers));
  if (question.live) startRotation();
  else glimpse();

  onKeys((event) => {
    if (!answered && (event.key === 'r' || event.key === 'R')) return glimpse();
    if (answered) { if (nextArmed && (event.key === ' ' || event.key === 'Enter')) { event.preventDefault(); advance(); } return; }
    if (pad) {
      if (/^\d$/.test(event.key)) pad.press(event.key);
      else if (event.key === 'Enter') pad.press('OK');
      else if (event.key === 'Backspace') pad.press('⌫');
    } else if (question.answerType === 'choice' && question.options && /^[1-4]$/.test(event.key) && question.options[event.key - 1]) submit(question.options[event.key - 1].value);
  });
}

/* ---------- Summary ---------- */

function showSummary() {
  const s = session;
  session = null;
  if (s.asked > 0) {
    commit(recordSession(progress, { at: s.startedAt, stage: s.stage, asked: s.asked, correct: s.correct,
      durationMs: Date.now() - s.startedAt }));
  }
  const accuracy = s.asked ? s.correct / s.asked : 0;
  const weak = weakSpots(progress.items, WEAK_SPOT_LIMIT).map(({ id, errors }) => ({ item: itemById(id), errors })).filter((w) => w.item);
  const bars = masteryBars(progress).map((bar) => h('div', { class: 'bar-row' }, h('span', {}, bar.label),
    h('div', { class: 'bar' }, h('i', { style: `transform:scaleX(${bar.value})` })), h('span', {}, percent(bar.value))));
  const unlockedNow = progress.completed.includes(s.stage);
  show(h('main', { class: 'screen summary' },
    h('h1', {}, 'SESSION COMPLETE'),
    h('div', { class: 'tiles' },
      h('div', {}, h('strong', {}, percent(accuracy)), h('small', {}, 'Accuracy')),
      h('div', {}, h('strong', {}, s.asked), h('small', {}, 'Questions')),
      h('div', {}, h('strong', {}, s.correct), h('small', {}, 'Correct')),
      h('div', {}, h('strong', {}, progress.streak), h('small', {}, 'Streak'))),
    reactionTimeActive(progress, s.stage) && s.hitLatencies.length > 0 && h('div', { class: 'tiles two' },
      h('div', {}, h('strong', {}, formatSeconds(s.hitLatencies.reduce((a, b) => a + b, 0) / s.hitLatencies.length)), h('small', {}, 'Average reaction')),
      h('div', {}, h('strong', {}, formatSeconds(Math.min(...s.hitLatencies))), h('small', {}, 'Best reaction'))),
    unlockedNow && h('p', { class: 'notice' }, `Stage ${s.stage} passed. Stage ${s.stage + 1} is unlocked.`),
    h('section', {}, bars),
    weak.length > 0 && h('section', {}, h('h2', {}, 'Your weak spots'),
      h('ul', { class: 'weak' }, weak.map((w) => h('li', {}, itemLabel(w.item), h('small', {}, `${w.errors} error${w.errors === 1 ? '' : 's'}`))))),
    h('div', { class: 'answers stack' },
      h('button', { class: 'btn btn-wide', onClick: () => startSession(s.stage) }, 'Train again'),
      h('button', { class: 'btn btn-ghost btn-wide', onClick: () => saveBackup(() => showHome('Backup saved.')) }, 'Save backup'),
      h('button', { class: 'btn btn-ghost btn-wide', onClick: () => showHome() }, 'Home'))));
}

/* ---------- Blank Wheel benchmark ---------- */

function showBenchmark() {
  const { anchor, order } = benchmarkOrder(Math.random);
  const placed = [anchor];
  const startedAt = Date.now();
  let errors = 0;
  let index = 0;
  let locked = false;
  const mount = h('div', { class: 'wheel-mount' });
  const prompt = h('p', { class: 'prompt' });
  const status = h('div', { class: 'stat-line' });
  const wheel = createWheel(mount, { onTap: (n) => {
    if (locked || placed.includes(n)) return;
    const target = order[index];
    const ok = n === target;
    if (!ok) errors += 1;
    placed.push(target);
    index += 1;
    locked = !ok;
    wheel.present({ hideNumbers: true, revealed: placed, highlight: [target], wrong: ok ? [] : [n] });
    if (ok) return draw();
    setTimeout(() => { locked = false; draw(); }, BENCHMARK_REVEAL_MS);
  } });
  wheel.setRotorAngle(randomRotorAngle(Math.random));

  function draw() {
    if (index >= order.length) return finish();
    prompt.replaceChildren('Tap the pocket of ', numberChip(order[index]));
    status.replaceChildren(h('span', {}, `${index} / ${order.length} placed`), h('span', {}, `${errors} error${errors === 1 ? '' : 's'}`),
      h('button', { class: 'link', onClick: () => showHome() }, 'Quit'));
    if (!locked) wheel.present({ hideNumbers: true, revealed: placed });
  }

  function finish() {
    const result = { at: startedAt, ms: Date.now() - startedAt, errors };
    commit(recordBenchmark(progress, result));
    showBenchmarkResult(result);
  }

  show(h('main', { class: 'screen train' }, status, mount, prompt,
    h('p', { class: 'hint' }, 'Only the anchor is given. A miss is counted and the right pocket is shown.')));
  draw();
}

function showBenchmarkResult(result) {
  const best = benchmarkBest(progress);
  const recent = progress.benchmark.slice(-BENCHMARK_TREND_COUNT);
  const worst = Math.max(1, ...recent.map((r) => r.errors));
  show(h('main', { class: 'screen summary' }, h('h1', {}, 'BLANK WHEEL'),
    h('div', { class: 'tiles two' },
      h('div', {}, h('strong', {}, result.errors), h('small', {}, 'Errors')),
      h('div', {}, h('strong', {}, formatClock(result.ms)), h('small', {}, 'Time'))),
    h('p', { class: 'notice' }, `Personal best: ${best.errors} error${best.errors === 1 ? '' : 's'} in ${formatClock(best.ms)}. Mastery needs 2 errors or fewer.`),
    h('section', {}, h('h2', {}, 'Trend · errors per run'),
      h('div', { class: 'trend' }, recent.map((r) => h('div', { class: 'trend-col' },
        h('i', { style: `transform:scaleY(${Math.max(0.04, r.errors / worst)})` }), h('small', {}, r.errors))))),
    h('div', { class: 'answers stack' },
      h('button', { class: 'btn btn-wide', onClick: showBenchmark }, 'Run again'),
      h('button', { class: 'btn btn-ghost btn-wide', onClick: () => showHome() }, 'Home'))));
}

/* ---------- Settings ---------- */

function showSettings() {
  const confirmBox = h('div', { class: 'confirm', hidden: true }, h('p', {}, 'Reset all training progress?'),
    h('div', { class: 'answers row' },
      h('button', { class: 'btn btn-ghost', onClick: () => { confirmBox.hidden = true; } }, 'Cancel'),
      h('button', { class: 'btn btn-danger', disabled: storageLocked, onClick: async () => { await clearProgress(); progress = defaultProgress(Date.now()); showHome('Progress reset.'); } }, 'Reset')));
  show(h('main', { class: 'screen settings' }, h('h1', {}, 'Settings'),
    h('button', { class: 'btn btn-ghost btn-wide', onClick: () => { commit({ ...progress, settings: { ...progress.settings, sound: !progress.settings.sound } }); showSettings(); } },
      `Sound: ${progress.settings.sound ? 'ON' : 'OFF'}`),
    h('button', { class: 'btn btn-ghost btn-wide', onClick: () => { commit({ ...progress, settings: { ...progress.settings, autoNext: !progress.settings.autoNext } }); showSettings(); } },
      `After a correct answer: ${progress.settings.autoNext ? 'continue automatically' : 'wait for Next'}`),
    h('button', { class: 'btn btn-ghost btn-wide', onClick: () => saveBackup(showSettings) }, 'Export progress'),
    importButton('Import progress', 'btn-ghost btn-wide'),
    h('button', { class: 'btn btn-danger btn-wide', onClick: () => { confirmBox.hidden = false; } }, 'Reset Progress'),
    confirmBox,
    h('button', { class: 'btn btn-wide', onClick: () => showHome() }, 'Back')));
}

/* ---------- Boot ---------- */

async function boot() {
  const loaded = await loadProgress(Date.now());
  storageLocked = loaded.locked === true;
  progress = loaded.progress ?? defaultProgress(Date.now());
  if (!loaded.progress && !storageLocked) requestDurableStorage();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch((error) => console.warn('Service worker registration failed', error));
  }
  showHome();
}

boot();

})();</script>
